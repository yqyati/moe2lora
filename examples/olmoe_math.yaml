# Representative MoE2-LoRA recipe; run from the repository root.
model_name_or_path: allenai/OLMoE-1B-7B-0924
trust_remote_code: true
use_reentrant_gc: false
stage: sft
do_train: true
finetuning_type: moe_lora
moe_lora_n_experts: 128
moe_lora_rank: 16
moe_lora_alpha: 32
moe_lora_top_k: 4
moe_lora_pool_share: global
moe_lora_w_share: per_layer
moe_lora_target_layers: all
moe_lora_balance_loss_coef: 0.0001
moe_lora_hidden_bottleneck_dim: 16
dataset: metamathqa_r1
template: default
cutoff_len: 2048
preprocessing_num_workers: 16
dataloader_num_workers: 4
output_dir: saves/olmoe_math
logging_steps: 5
plot_loss: true
overwrite_output_dir: false
save_only_model: true
report_to: none
per_device_train_batch_size: 8
gradient_accumulation_steps: 8
learning_rate: 0.0004
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_find_unused_parameters: true
save_strategy: 'no'
