# Representative MoE2-LoRA recipe; run from the repository root.
model_name_or_path: Qwen/Qwen3-30B-A3B-Base
trust_remote_code: true
use_reentrant_gc: false
stage: sft
do_train: true
finetuning_type: moe_lora
moe_lora_n_experts: 512
moe_lora_n_groups: 4
moe_lora_rank: 16
moe_lora_alpha: 32
moe_lora_top_k: 8
moe_lora_pool_share: global
moe_lora_w_share: per_layer
moe_lora_target_layers: all
moe_lora_hidden_bottleneck_dim: 32
dataset: magicoder_oss_75k
template: qwen3
cutoff_len: 2048
preprocessing_num_workers: 16
dataloader_num_workers: 4
output_dir: saves/qwen3_code
logging_steps: 5
save_strategy: 'no'
plot_loss: true
overwrite_output_dir: false
save_only_model: true
report_to: none
per_device_train_batch_size: 8
gradient_accumulation_steps: 18
learning_rate: 0.0006
num_train_epochs: 1.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
gradient_checkpointing: false
ddp_find_unused_parameters: true
ddp_broadcast_buffers: false
